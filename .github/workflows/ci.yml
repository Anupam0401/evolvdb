name: CI Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [17, 21]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Check code formatting
      run: ./gradlew spotlessCheck --no-daemon
      env:
        GRADLE_OPTS: -Dorg.gradle.daemon=false
    
    - name: Build with Gradle
      run: ./gradlew clean build --no-daemon --stacktrace
      env:
        GRADLE_OPTS: -Dorg.gradle.daemon=false
    
    - name: Run tests
      run: ./gradlew test --no-daemon --stacktrace
      env:
        GRADLE_OPTS: -Dorg.gradle.daemon=false
    
    - name: Generate test report
      if: always()
      run: ./gradlew testReport --no-daemon
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-java-${{ matrix.java-version }}
        path: |
          **/build/test-results/**/*.xml
          **/build/reports/tests/**
    
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-java-${{ matrix.java-version }}
        path: |
          **/build/libs/*.jar
    
    - name: Publish test report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Test Results (Java ${{ matrix.java-version }})
        path: '**/build/test-results/**/*.xml'
        reporter: java-junit
        fail-on-error: true

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Check code style (if checkstyle configured)
      run: ./gradlew checkstyleMain checkstyleTest --no-daemon || true
      continue-on-error: true
    
    - name: Run static analysis (if spotbugs configured)
      run: ./gradlew spotbugsMain --no-daemon || true
      continue-on-error: true
    
    - name: Check dependencies
      run: ./gradlew dependencyUpdates --no-daemon || true
      continue-on-error: true

  build-status:
    name: Build Status Check
    runs-on: ubuntu-latest
    needs: [build, code-quality]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "Build failed!"
          exit 1
        fi
        echo "All checks passed!"
