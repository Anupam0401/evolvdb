name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Check PR title format
      uses: amannn/action-semantic-pull-request@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
          revert
        requireScope: false
        subjectPattern: ^[A-Z].+$
        subjectPatternError: |
          The PR title must start with a capital letter.
          Example: "feat: Add UPDATE and DELETE statements"
    
    - name: Check for merge conflicts
      run: |
        git fetch origin main
        if git merge-tree $(git merge-base HEAD origin/main) HEAD origin/main | grep -q "^+<<<<<<< "; then
          echo "::error::PR has merge conflicts with main branch"
          exit 1
        fi
    
    - name: Check file changes
      run: |
        echo "Files changed in this PR:"
        git diff --name-only origin/main...HEAD
        
        # Fail if too many files changed (likely mass refactor without review)
        CHANGED_FILES=$(git diff --name-only origin/main...HEAD | wc -l)
        if [ $CHANGED_FILES -gt 100 ]; then
          echo "::warning::PR changes $CHANGED_FILES files. Consider breaking into smaller PRs."
        fi

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Check code formatting
      run: ./gradlew spotlessCheck --no-daemon
    
    - name: Clean build
      run: ./gradlew clean build --no-daemon --stacktrace
    
    - name: Verify all modules build
      run: ./gradlew assemble --no-daemon
    
    - name: Check for compilation warnings
      run: |
        ./gradlew clean compileJava 2>&1 | tee build.log
        if grep -q "warning:" build.log; then
          echo "::warning::Compilation warnings detected"
          grep "warning:" build.log
        fi

  test-coverage:
    name: Test Coverage Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Run tests with coverage
      run: ./gradlew test jacocoTestReport --no-daemon || true
      continue-on-error: true
    
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: '**/build/reports/jacoco/**'

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check for documentation updates
      run: |
        # Check if code changes include corresponding doc updates
        CODE_CHANGED=$(git diff --name-only origin/main...HEAD | grep -E '\.(java|kt)$' | wc -l)
        DOCS_CHANGED=$(git diff --name-only origin/main...HEAD | grep -E 'docs/.*\.md$|README\.md$' | wc -l)
        
        if [ $CODE_CHANGED -gt 10 ] && [ $DOCS_CHANGED -eq 0 ]; then
          echo "::warning::Large code changes detected without documentation updates"
        fi
    
    - name: Check markdown files
      uses: DavidAnson/markdownlint-cli2-action@v14
      with:
        globs: '**/*.md'
      continue-on-error: true

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Check for vulnerable dependencies
      run: ./gradlew dependencyCheckAnalyze --no-daemon || true
      continue-on-error: true

  pr-status:
    name: PR Status
    runs-on: ubuntu-latest
    needs: [pr-validation, build-verification, test-coverage, documentation-check]
    if: always()
    
    steps:
    - name: Check PR status
      run: |
        if [ "${{ needs.pr-validation.result }}" != "success" ] || \
           [ "${{ needs.build-verification.result }}" != "success" ]; then
          echo "::error::PR checks failed!"
          exit 1
        fi
        echo "✅ All PR checks passed!"
